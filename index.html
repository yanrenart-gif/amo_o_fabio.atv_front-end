
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <section class="gallery">

            <!-- Imagem grande à esquerda -->
            <div class="image image-large">
                <img src="img/fone1.jpg" alt="Fone de ouvido">
            </div>


            <div class="image image-top">
                <img src="img/fone2.jpg" alt="Fone de ouvido na mão">
            </div>

      
            <div class="image image-bottom">
                <img src="img/fone3.jpg" alt="Estojo de fones">
            </div>

          
            <div class="text-box">
                <p>
                    Computer networks come in many forms:
                    home networks, business networks, and the
                    internet are three common examples.
                </p>
            </div>

        </section>

    </main>

</body>
</html>
